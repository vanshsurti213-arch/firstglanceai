name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite
        run: npm test

      - name: Run Linter
        run: npm run lint

      - name: Build Tensor Shaders
        run: npm run build

  deploy-production:
    name: Production Deployment Rollout
    needs: [build-and-test]
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://api.firstglance.ai/v1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Container & Run Ingress Verification Probe
        run: |
          echo "🚀 Initiating production deployment rollout..."
          npm run deploy:verify
